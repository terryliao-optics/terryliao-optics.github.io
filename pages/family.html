    <style>
        #lock {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(249, 247, 244, 0.985);
            -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
        }
        #lock .lock-box {
            background: #ffffff; padding: 34px 30px 26px; border-radius: 18px;
            border: 1px solid #e3efe7; box-shadow: 0 14px 44px rgba(0, 0, 0, 0.14);
            text-align: center; width: min(340px, 86vw);
        }
        #lock h3 { font-family: 'Noto Serif SC', 'STSong', serif; color: #1e6b3f; margin: 0 0 6px; font-size: 1.18em; letter-spacing: 0.10em; }
        #lock .hint { font-size: 0.82em; color: #9ab7a6; margin: 0 0 18px; letter-spacing: 0.04em; }
        #lock input {
            width: 100%; box-sizing: border-box; padding: 13px 18px; border-radius: 999px;
            border: 1.5px solid #c8e6d4; font-size: 1em; outline: none; text-align: center;
            letter-spacing: 0.18em; transition: border-color 0.2s, box-shadow 0.2s;
        }
        #lock input:focus { border-color: #2E8B57; box-shadow: 0 0 0 4px rgba(46, 139, 87, 0.10); }
        #lock button {
            margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 999px;
            background: #2E8B57; color: #fff; font-size: 1em; letter-spacing: 0.14em;
            cursor: pointer; transition: background 0.2s;
        }
        #lock button:hover { background: #1e6b3f; }
        #lock button[disabled] { opacity: 0.6; cursor: default; }
        #lock .msg { margin: 12px 0 0; min-height: 1.2em; font-size: 0.85em; color: #c0392b; letter-spacing: 0.03em; }
        #lock .back { margin: 16px 0 0; font-size: 0.82em; }
        #lock .back a { color: #9ab7a6; text-decoration: none; }
        #lock .back a:hover { color: #2E8B57; }
        @keyframes lock-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
        #lock .lock-box.shake { animation: lock-shake 0.35s; }

        <button id="lock-btn" type="button">解 锁</button>

</div>

<main id="main">

<script>
(function () {
    var lock = document.getElementById('lock');
    var box = lock.querySelector('.lock-box');
    var input = document.getElementById('lock-input');
    var btn = document.getElementById('lock-btn');
    var msg = document.getElementById('lock-msg');
    var enc = document.getElementById('enc');
    var target = document.getElementById('family-content');

    document.body.style.overflow = 'hidden';

    function b64ToBytes(b64) {
        var s = atob(b64), u = new Uint8Array(s.length);
        for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
        return u;
    }
    function fail(text) {
        msg.textContent = text || '密码不正确，请重试';
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
        input.value = '';
        input.focus();
        btn.disabled = false;
        btn.textContent = '解 锁';
    }

    var P;
    try { P = JSON.parse(enc.textContent); } catch (e) { P = null; }

    if (!window.crypto || !window.crypto.subtle) {
        btn.disabled = true;
        msg.style.color = '#9ab7a6';
        msg.textContent = '当前环境不支持解密（请通过 https 访问）';
        return;
    }

    async function attempt() {
        if (!P) { fail('页面数据缺失'); return; }
        var pw = input.value.trim();
        if (!pw) { input.focus(); return; }
        btn.disabled = true;
        btn.textContent = '解锁中…';
        msg.textContent = '';
        try {
            var salt = b64ToBytes(P.salt), iv = b64ToBytes(P.iv), ct = b64ToBytes(P.ct);
            var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
            var key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: P.iter, hash: 'SHA-256' },
                base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
            var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
            target.innerHTML = new TextDecoder().decode(pt);
            lock.style.display = 'none';
            document.body.style.overflow = '';
        } catch (e) {
            fail();
        }
    }

    btn.addEventListener('click', attempt);
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); attempt(); }
    });
    input.focus();
})();
</script>
