        #lock .back a:hover { color: #2E8B57; }
        @keyframes lock-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            75% { transform: translateX(7px); }

        #lock .lock-box.shake { animation: lock-shake 0.35s; }

<script>
/* 家庭时光 · 轻量密码门（前端校验，仅作防闲人查看用） */
(function () {
    var KEY = 'bHl6Nzc3'; // 访问口令（base64）
    var lock = document.getElementById('lock');
    var box = lock.querySelector('.lock-box');
    var input = document.getElementById('lock-input');
    var btn = document.getElementById('lock-btn');
    var msg = document.getElementById('lock-msg');

    document.body.style.overflow = 'hidden';

    function unlock() {
        lock.style.display = 'none';
        document.body.style.overflow = '';
    }
    function fail() {
        msg.textContent = '密码不正确，请重试';
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
        input.value = '';
        input.focus();
    }
    function attempt() {
        var v = input.value.trim();
        var ok = false;
        try { ok = (v === atob(KEY)); } catch (e) { ok = false; }
        if (ok) { unlock(); } else { fail(); }
    }

    btn.addEventListener('click', attempt);
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); attempt(); }
    });
    input.focus();
})();
</script>
